<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Besitos para Maiia!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&family=Caveat:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f0ff 0%, #e8dbff 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(106, 90, 205, 0.15);
            max-width: 380px;
            width: 90%;
            margin-bottom: 20px;
        }

        /* Nube de diálogo de Kuromi */
        .speech-bubble {
            position: relative;
            background: #4a4a4a;
            color: white;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        /* Flecha de la nube */
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 0;
            border: 15px solid transparent;
            border-top-color: #4a4a4a;
            border-bottom: 0;
            margin-left: -15px;
            margin-bottom: -15px;
            transition: border-top-color 0.3s;
        }

        /* Controles para pasar las razones */
        .nav-razones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .btn-nav {
            background: #6a5acd;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 10px rgba(106, 90, 205, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-nav:hover {
            background: #5344b3;
            transform: scale(1.1);
        }

        .contador {
            font-size: 13px;
            color: #777;
            font-weight: bold;
            background: #f0ebff;
            padding: 4px 12px;
            border-radius: 15px;
        }

        .kuromi-img {
            width: 170px;
            height: auto;
            margin-bottom: 20px;
        }

        .btn-beso {
            background-color: #ff4da6;
            color: white;
            border: none;
            padding: 15px 35px;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 166, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }

        .btn-beso:hover {
            transform: scale(1.05);
            background-color: #e0358d;
        }

        .btn-beso:active {
            transform: scale(0.95);
        }

        /* Frase bonita */
        .frase-bonita {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #554477;
            margin-top: 10px;
            line-height: 1.2;
        }

        /* Créditos del autor */
        .footer-autor {
            font-size: 12px;
            color: #7a6b94;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-autor span {
            color: #ff4da6;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .kiss-particle {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            pointer-events: none;
            animation: flyUp 3s linear forwards;
            z-index: 999;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) scale(1.5) rotate(var(--rot));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nube con la razón -->
        <div class="speech-bubble" id="bubble">
            Cargando razones... 🖤
        </div>

        <!-- Controles para cambiar de razón -->
        <div class="nav-razones">
            <button class="btn-nav" onclick="cambiarRazon(-1)">◀</button>
            <span class="contador" id="count">1 / 20</span>
            <button class="btn-nav" onclick="cambiarRazon(1)">▶</button>
        </div>

        <!-- Imagen de Kuromi -->
        <img src="https://robnei.net/wp-content/uploads/2025/06/Kuromi-Sentado-Robnei-1024x941.png" alt="Kuromi" class="kuromi-img">

        <br>
        <button class="btn-beso" onclick="lanzarBesos()">¡Mandarme Besitos! 💋</button>

        <!-- Frase bonita -->
        <div class="frase-bonita">
            "De todas las razones, mi favorita siempre será una sonrisa tuya." ✨🖤
        </div>
    </div>

    <!-- Autor de la página -->
    <div class="footer-autor">
        Hecho con <span>♥</span> por Camilo
    </div>

    <script>
        // Las 20 razones para Maiia
        const razones = [
            "Deberías mandarme besitos porque soy tu persona favorita (aunque a veces te hagas la ruda). 🖤",
            "Porque un besito tuyo me alegra todo el día, Maiia. 🥰",
            "Porque Kuromi dice que es obligatorio por ley darme besitos hoy. ⚖️👑",
            "Porque combinamos mejor que Kuromi con My Melody. 💖🖤",
            "Porque te extraño y un besito tuyo lo cura todo. 🩹✨",
            "Porque soy un amor y me los he ganado por completo. 😏",
            "Porque si no me mandas besitos, Kuromi se va a enojar y se pondrá a hacer berrinche. 👿",
            "Porque besarme (aunque sea de lejitos por ahora) es bueno para tu salud. 🩺❤️",
            "Porque valgo oro y los besitos son mi propina. 🪙✨",
            "Porque me encanta consentirte y ahora te toca a ti. 💆‍♂️",
            "Porque tienes los labios más lindos del mundo y hay que aprovecharlos. 👄",
            "Porque lo digo yo, Kuromi y tu corazón. ¡Ya hazles caso! 💓",
            "Porque me pones nervioso y la única cura son tus besitos. 🫣",
            "Porque eres la niña más linda y las niñas lindas mandan besos. 🎀",
            "Porque no te cuesta nada y a mí me haces inmensamente feliz. 😁",
            "Porque el día está muy frío y tus besos me quitan el frío. ❄️🔥",
            "A ver Maiia, ¿necesitas una razón? ¡Simplemente porque me encantas! 🤷‍♂️💕",
            "Porque cada pequeño beso tuyo hace que te quiera un poquito más. 📈❤️",
            "Porque me he portado muy bien contigo últimamente (admítelo). 😇",
            "Porque Kuromi hackeó esta página solo para recordarte que me debes un beso. 💻🖤"
        ];

        let indiceActual = 0;
        let bloqueadoPorBeso = false;

        function actualizarNube() {
            if (bloqueadoPorBeso) return;
            const nube = document.getElementById('bubble');
            const contador = document.getElementById('count');
            
            nube.innerHTML = `¡Oye Maiia! ${razones[indiceActual]}`;
            contador.innerText = `${indiceActual + 1} / ${razones.length}`;
        }

        function cambiarRazon(direccion) {
            if (bloqueadoPorBeso) return; 
            
            indiceActual += direccion;
            
            if (indiceActual >= razones.length) {
                indiceActual = 0;
            } else if (indiceActual < 0) {
                indiceActual = razones.length - 1;
            }
            
            actualizarNube();
        }

        window.onload = actualizarNube;

        function lanzarBesos() {
            bloqueadoPorBeso = true;
            const nube = document.getElementById('bubble');
            
            nube.innerHTML = "¡Siiiii! ¡Gracias por los besitos, Maiia! Sabía que no te ibas a resistir 🥰🖤";
            nube.style.backgroundColor = "#ff4da6";
            
            const estiloFlecha = document.createElement('style');
            estiloFlecha.id = 'dynamic-arrow';
            estiloFlecha.innerHTML = '.speech-bubble:after { border-top-color: #ff4da6 !important; }';
            document.head.appendChild(estiloFlecha);

            const emojis = ['💋', '❤️', '😘', '💕', '🖤'];
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const beso = document.createElement('div');
                    beso.classList.add('kiss-particle');
                    beso.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    beso.style.left = Math.random() * 100 + 'vw';
                    beso.style.fontSize = Math.random() * (35 - 20) + 20 + 'px';
                    beso.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                    beso.style.animationDuration = Math.random() * (3.5 - 2) + 2 + 's';
                    
                    document.body.appendChild(beso);
                    
                    setTimeout(() => { beso.remove(); }, 3500);
                }, i * 80);
            }

            setTimeout(() => {
                nube.style.backgroundColor = "#4a4a4a";
                const estiloAQuitar = document.getElementById('dynamic-arrow');
                if (estiloAQuitar) estiloAQuitar.remove();
                
                bloqueadoPorBeso = false;
                actualizarNube();
            }, 5000);
        }
    </script>

</body>
</html>
